[package]
name = "overmind-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
autotests = false

[lib]
name = "overmind_desktop"
path = "src/lib.rs"

[[bin]]
name = "overmind-desktop"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["tray-icon", "wry", "compression"] }
tauri-plugin-shell = "=2.5.0"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-dialog = "=2.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["net", "io-util", "time", "sync", "rt"] }
nix = { version = "=0.31.3", default-features = false, features = ["user", "socket"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
exacl = { version = "=0.13.0", default-features = false }

[build-dependencies]
tauri-build = "=2.7.2"
serde_json = "=1.0.154"

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["macros", "rt"] }
tauri = { version = "=2.12.3", default-features = false, features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
