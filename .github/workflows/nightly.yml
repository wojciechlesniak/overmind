name: Nightly audit
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
defaults:
  run:
    shell: bash
jobs:
  audit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: |
          set -euo pipefail
          pnpm audit --audit-level=high --prod || { echo "production audit failed or unavailable"; exit 1; }
          pnpm audit --audit-level=critical || { echo "development audit failed or unavailable"; exit 1; }
          if [[ -f apps/desktop/src-tauri/Cargo.lock ]]; then
            tool="$(pnpm exec tsx tools/pinned-bin/install.ts cargo-audit)"
            "$tool" audit --file apps/desktop/src-tauri/Cargo.lock
          fi
  report:
    needs: audit
    if: always() && needs.audit.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only this notification job may create/update the single audit tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$REPOSITORY" --state open --search 'in:title ci: audit failure' --json number,title --jq 'map(select(.title == "ci: audit failure")) | first | .number // empty')"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          printf 'Dependency audit failed or was unavailable. Inspect the run: %s\n' "$RUN_URL" > "$body"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --repo "$REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$REPOSITORY" --title 'ci: audit failure' --body-file "$body"
          fi
