name: Isolation
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group: {}
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number, or empty for the current default branch
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
defaults:
  run:
    shell: bash
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read-only API access verifies the selected PR and its latest hosted CI run.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed || 'false' }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      # PR/queue YAML is untrusted. A maintainer dispatches the default-branch
      # definition with a PR number after hosted CI and SHA-bound approval.
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          echo 'A maintainer must dispatch the trusted default-branch workflow with the approved PR number.'
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: $/.github/actions/setup
      - id: check
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm exec tsx tools/ci/isolation-gate.ts
  escape:
    needs: gate
    # Recheck current approval through read-only metadata after runner queueing.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: needs.gate.outputs.allowed == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # OVE_SETUP021 must enforce trusted-workflow runner access and ephemeral disposal.
    runs-on: [self-hosted, macOS, ARM64, overmind-macos26] # zizmor: ignore[self-hosted-runner] -- OVE_SETUP006 requires a dedicated ephemeral macOS 26 host for Apple container; hosted gate admits approved same-repository SHA only.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: $/.github/actions/setup
      - id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm exec tsx tools/ci/isolation-gate.ts
      - id: policy
        env:
          APPROVED_SHA: ${{ needs.gate.outputs.sha }}
          CURRENT_SHA: ${{ steps.recheck.outputs.sha }}
          CURRENT_ALLOWED: ${{ steps.recheck.outputs.allowed }}
        run: |
          set -euo pipefail
          [[ "$CURRENT_ALLOWED" == true && "$CURRENT_SHA" == "$APPROVED_SHA" ]]
          node_path="$(node tools/ci/isolation-trusted-tools.mjs "$(command -v node)")"
          container_path="$(node tools/ci/isolation-trusted-tools.mjs "$(command -v container)")"
          [[ "$HOME" == /* && "$HOME" != *$'\n'* && "$HOME" != *$'\r'* ]]
          # Root provisions this immutable file from the trusted default branch.
          # Job-writable staging would permit a hash-to-execution race.
          cleanup="$(node tools/ci/isolation-trusted-tools.mjs /opt/overmind-ci/isolation-cleanup.mjs)"
          digest="$(/usr/bin/shasum -a 256 "$cleanup" | /usr/bin/cut -d ' ' -f 1)"
          expected="$(/usr/bin/shasum -a 256 tools/ci/isolation-cleanup.mjs | /usr/bin/cut -d ' ' -f 1)"
          [[ "$digest" == "$expected" ]]
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "node=$node_path" >> "$GITHUB_OUTPUT"
          echo "container=$container_path" >> "$GITHUB_OUTPUT"
          echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"
          echo "home=$HOME" >> "$GITHUB_OUTPUT"
          "$container_path" --version
          version="$(sw_vers -productVersion)"
          [[ "${version%%.*}" -ge 26 ]]
          [[ "$(uname -m)" == arm64 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: |
          set -euo pipefail
          pnpm test:escape
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escape-evidence
          path: |
            escape-evidence/
            !escape-evidence/**/.env*
          retention-days: 7
          if-no-files-found: error
      - if: always()
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_CLEANUP_SHA: ${{ steps.policy.outputs.sha256 }}
          TRUSTED_NODE: ${{ steps.policy.outputs.node }}
          TRUSTED_CONTAINER: ${{ steps.policy.outputs.container }}
          TRUSTED_CLEANUP: ${{ steps.policy.outputs.cleanup }}
          TRUSTED_HOME: ${{ steps.policy.outputs.home }}
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          set -euo pipefail
          if [[ -z "$TRUSTED_CONTAINER" || -z "$TRUSTED_NODE" || -z "$TRUSTED_HOME" ]]; then
            echo 'Trusted cleanup preflight did not complete.' >&2
            exit 1
          fi
          stop_container() {
            /usr/bin/env -i HOME="$TRUSTED_HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$TRUSTED_CONTAINER" system stop
          }
          if [[ ! -f "$TRUSTED_CLEANUP" || -z "$EXPECTED_CLEANUP_SHA" ]]; then
            stop_container
            exit 1
          fi
          if ! actual="$(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/shasum -a 256 "$TRUSTED_CLEANUP" | /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/cut -d ' ' -f 1)"; then
            stop_container
            exit 1
          fi
          if [[ "$actual" != "$EXPECTED_CLEANUP_SHA" ]]; then
            stop_container
            exit 1
          fi
          /usr/bin/env -i HOME="$TRUSTED_HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$TRUSTED_NODE" "$TRUSTED_CLEANUP" "$TRUSTED_CONTAINER"
