name: Overmind setup
description: Pinned Node and pnpm with a frozen, policy-checked dependency install
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - shell: bash
      run: |
        set -euo pipefail
        corepack enable
    - id: store
      shell: bash
      run: |
        set -euo pipefail
        store_path="$(pnpm store path --silent)"
        [[ "$store_path" == /* && "$store_path" != *$'\n'* ]]
        echo "path=$store_path" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      env:
        CI: "true"
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
    - if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
